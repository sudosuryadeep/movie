<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Telegram API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(92%, 500px);
      padding: 35px;
      border-radius: 20px;
      background: #1e293b;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 14px;
      border-radius: 12px;
      background: #172033;
      color: #4ade80;
      font-weight: bold;
    }

    code {
      display: block;
      margin-top: 20px;
      padding: 12px;
      background: #020617;
      border-radius: 10px;
      color: #93c5fd;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Telegram API</h1>

    <p>
      Telegram publishing API is running successfully.
    </p>

    <div class="status">
      ● API ONLINE
    </div>

    <code>/api/telegram</code>
  </div>
</body>
</html>
